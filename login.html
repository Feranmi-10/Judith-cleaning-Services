<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Sign Up — Judith Cleaning Services</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="https://res.cloudinary.com/dinypexvn/image/upload/v1792828963/judith-site/icon.png"><meta name="theme-color" content="#1fa968">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
<div id="app-header"></div>

<div class="auth-wrap">
  <div class="card">
    <div class="center" style="margin-bottom:18px">
      <img src="https://res.cloudinary.com/dinypexvn/image/upload/v1792828961/judith-site/logo.jpg" alt="Judith Cleaning Services" style="height:88px;border-radius:14px;margin:0 auto 12px;display:block;box-shadow:0 4px 16px rgba(26,19,51,.3)">
      <h2 style="color:var(--navy)">Welcome</h2>
      <p class="muted" style="font-size:.9rem">Log in or create an account to book and track cleanings.</p>
    </div>

    <button class="g-btn" onclick="google()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.2 44 30 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>
    <div class="divider">or use email</div>

    <div class="tabbtns">
      <button id="tab-login" class="cur" onclick="mode('login')">Log In</button>
      <button id="tab-signup" onclick="mode('signup')">Sign Up</button>
    </div>

    <div id="f-signup" hidden>
      <label>Full name</label><input id="su-name" placeholder="Your name">
      <label>Phone</label><input id="su-phone" placeholder="0801 234 5678">
    </div>
    <label>Email</label><input id="a-email" type="email" placeholder="you@example.com">
    <label>Password</label><input id="a-pass" type="password" placeholder="••••••••">
    <button class="btn btn-primary btn-block" style="margin-top:20px" id="a-go" onclick="submit()">Log In</button>
    <p class="center" style="margin-top:14px;font-size:.86rem"><a href="#" onclick="forgot();return false">Forgot password?</a></p>
  </div>
</div>

<div id="app-footer"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/config.js"></script><script src="js/firebase-init.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
<script>
let m = "login";
function mode(x) {
  m = x;
  document.getElementById("tab-login").classList.toggle("cur", x === "login");
  document.getElementById("tab-signup").classList.toggle("cur", x === "signup");
  document.getElementById("f-signup").hidden = x !== "signup";
  document.getElementById("a-go").textContent = x === "login" ? "Log In" : "Create Account";
}
function done() {
  const next = UI.param("next");
  location.href = next || Auth.homeFor(Auth.profile ? Auth.profile.role : "customer");
}
async function google() {
  try { await Auth.google(); setTimeout(done, 600); }
  catch (e) { UI.toast(e.message, "err"); }
}
async function submit() {
  const email = document.getElementById("a-email").value.trim();
  const pass = document.getElementById("a-pass").value;
  try {
    if (m === "signup") {
      const name = document.getElementById("su-name").value.trim();
      if (!name) return UI.toast("Please enter your name.", "err");
      await Auth.signup(name, email, pass, document.getElementById("su-phone").value.trim());
      UI.toast("Account created!");
    } else {
      await Auth.login(email, pass);
    }
    setTimeout(done, 400);
  } catch (e) { UI.toast(e.message.replace("Firebase: ", ""), "err"); }
}
async function forgot() {
  const email = document.getElementById("a-email").value.trim();
  if (!email) return UI.toast("Type your email above first.", "err");
  try { await Auth.reset(email); UI.toast("Password reset email sent."); }
  catch (e) { UI.toast(e.message, "err"); }
}
// already logged in? go home
Auth.onChange(p => { if (p && !UI.param("stay")) done(); });
</script>
</body>
</html>
